[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mabat"
version = "0.1.0"
description = "Automatic monthly client reports for accounting firms, from OPENFRMT exports"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "playwright==1.64.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mabat = "mabat.cli:main"

[tool.setuptools.packages.find]
include = ["mabat*"]

[tool.setuptools.package-data]
mabat = ["report/templates/*", "web/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
