# מיפוי שדות לקובצי "מבנה אחיד" (OPENFRMT), מהדורה 1.31.
# מקור: docs/spec/openfrmt-horaot-1.31.pdf (רשות המסים, 10.05.2009).
# id = מספר השדה במפרט. start/end = עמודות, מבוססות 1, כולל שני הקצוות.
# type: alnum = אלפאנומרי (מיושר לשמאל, ריפוד ברווחים)
#       num   = נומרי (מיושר לימין, ריפוד באפסים)
#       amount = X9(n)v99: תו סימן ואחריו ספרות, שתי האחרונות אחרי הנקודה
# רשומות בלי fields נספרות לצורך ולידציה בלבד ותוכנן אינו מפוענח.

spec_version: "1.31"

