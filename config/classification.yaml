# סיווג חשבונות לרווח והפסד.
#
# הקובץ הזה מתאים לנתוני הדמה שב-data/sample. למשרד אמיתי יש לכתוב כללים לפי
# הקודים שמופיעים בפועל בייצוא של התוכנה שלו (ברבגונית: לברר מול משרד הפיילוט).

period:
  # לפי איזה תאריך משייכים תנועה לחודש:
  #   date       = שדה 1362 "תאריך" (ברירת המחדל)
  #   value_date = שדה 1363 "תאריך ערך"
  date_field: date

# הכללים נבדקים לפי הסדר; הראשון שמתאים קובע. כל התנאים בתוך match חייבים להתקיים.
#
# תנאים אפשריים ב-match:
#   account_key:      [מפתחות חשבון]              (שדה 1403)
#   tb_code:          [קודי מאזן בוחן]            (שדה 1405)
#   tb_code_range:    {from: N, to: M}            (שדה 1405, כשהקוד מספרי)
#   code_6111_range:  {from: N, to: M}            (שדה 1417, קוד טופס 6111)
#
# type:     income | expense | balance_sheet
#           חשבון balance_sheet אינו נכנס לרווח והפסד.
# category: שם הקטגוריה בדוח (לא חובה). ברירת המחדל היא תיאור קוד מאזן הבוחן
#           (שדה 1406), ואם הוא ריק — שם החשבון.
#
# חשבון שיש לו תנועות ואף כלל לא מתאים לו עוצר את התהליך.

rules:
  - match: {tb_code_range: {from: 100, to: 199}}
    type: income
  - match: {tb_code_range: {from: 200, to: 399}}
    type: expense
  - match: {tb_code_range: {from: 500, to: 599}}
    type: balance_sheet
