# ספי זיהוי החריגות. סכומים בשקלים שלמים, אחוזים במספרים שלמים.
# כל ההשוואות הן "מעל הסף": ערך שנמצא בדיוק על הסף אינו חריגה.

# כמה חודשים קודמים משמשים בסיס להשוואה. בלי היסטוריה כזו לפני חודש היעד
# רצה רק בדיקת הסימן ההפוך, והדוח מסומן "דורש בדיקה".
history_months: 3

# קטגוריה שסטתה מהממוצע של החודשים הקודמים.
category_deviation:
  orange_pct: 30      # סטייה מעל האחוז הזה: כתום
  red_pct: 60         # סטייה מעל האחוז הזה: אדום
  min_diff_ils: 500   # מתעלמים מסטייה שההפרש שלה מהממוצע אינו עולה על הסכום הזה
  # סטייה לטובת הלקוח (הכנסה שעלתה, הוצאה שירדה) מדווחת תמיד כ"מידע".

# קטגוריה בלי פעילות בחודשים הקודמים, שהופיעה החודש בסכום גדול.
one_off:
  orange_share_pct: 10   # נתח מסך ההכנסות (או ההוצאות) של החודש
  red_share_pct: 25

# כרטיס שסיים את החודש בסימן הפוך לסוג שלו (למשל הוצאה ביתרת זכות).
sign_flip:
  min_amount_ils: 100

# כרטיס שהסכום בו גבוה פי כמה מהממוצע שלו, בלי שהקטגוריה כולה חרגה.
account_spike:
  ratio: 3
  min_diff_ils: 500
